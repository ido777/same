name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: npm install
        working-directory: packages/backend

      - name: Build backend
        run: npm run build
        working-directory: packages/backend

      - name: Run backend tests
        run: npm test
        working-directory: packages/backend

      # Start the backend server in the background so that the Playwright
      # tests can hit the API endpoints.  We do not wait for this
      # command to finish.
      - name: Start backend server for frontend tests
        run: |
          node dist/server.js &
        working-directory: packages/backend

      - name: Install frontend dependencies
        run: npm install
        working-directory: packages/frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: packages/frontend

      - name: Build frontend
        run: npm run build
        working-directory: packages/frontend

      # Start the static preview server for the built frontend so that
      # Playwright can load the application.  Vite preview defaults to
      # port 4173; you can override it via the --port flag.  We run
      # this in the background.
      - name: Start frontend preview server
        run: npm run preview -- --port 4173 &
        working-directory: packages/frontend

      # Give both the backend and frontend servers a moment to start up
      - name: Wait for servers
        run: sleep 5

      - name: Run frontend tests
        run: npm test
        working-directory: packages/frontend